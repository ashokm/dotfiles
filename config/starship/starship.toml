add_newline = false
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$nodejs\
$python\
$cmd_duration $jobs $custom $time\
$line_break\
$character"""

[character]
success_symbol = '[»](bold green)'
error_symbol = '[»](bold red)'

[cmd_duration]
format = '[$duration]($style)'
style = 'yellow'

[directory]
style = 'blue'
read_only = ''
truncation_length = 8
truncate_to_repo = false

[fill]
symbol = ' '

[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
style = 'bright-black'

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = 'bright-black'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = 'bright-black'
conflicted = '💥  '
ahead = '🏎️💨×${count} '
behind = '🐢×${count} '
diverged = '🔱 🏎️💨×${ahead_count} 🐢×${behind_count}'
untracked = '🤷×${count}'
stashed = '📦 '
modified = '📝×${count} '
staged = '🔦️×${count}'
renamed = '🏷️×${count} '
deleted = '🗑️ ×${count} '

[custom.git_profile]
# Discreet profile marker without exposing identity details.
when = 'true'
command = '''
origin="$(git config --show-origin --get user.email 2>/dev/null | awk '{print $1}')"
if [ -z "$origin" ]; then
  origin="$(git config --global --show-origin --get user.email 2>/dev/null | awk '{print $1}')"
fi

case "$origin" in
  *".gitconfig-work") printf "👤 work" ;;
  *".gitconfig-home") printf "👤 home" ;;
  *) printf "⚠️ none" ;;
esac
'''
format = '[$output]($style) '
style = 'bright-black'

[jobs]
symbol = ''
style = 'bold red'
number_threshold = 1
format = '[$symbol]($style)'

[nodejs]
style = 'bright-black'
format = '[$symbol($version )]($style)'

[package]
disabled = true

[python]
style = 'bright-black'
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[time]
disabled = false
format = '[$time]($style) '
style = 'bright-black'

[username]
style_user = 'bold dimmed blue'
show_always = false
